apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "autodiscover.fullname" . }}-test-connection"
  labels:
    {{- include "autodiscover.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['sh', '-c', 'wget -qO- http://{{ include "autodiscover.fullname" . }}:{{ .Values.service.port }}/healthz']
  restartPolicy: Never
