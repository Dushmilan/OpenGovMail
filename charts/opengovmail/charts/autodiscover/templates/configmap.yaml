apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autodiscover.fullname" . }}
  labels:
    {{- include "autodiscover.labels" . | nindent 4 }}
data:
  opengovmail.yaml: |
    domains:
{{- range include "autodiscover.domains" . | fromJsonArray }}
      - domain: {{ . | quote }}
{{- end }}
