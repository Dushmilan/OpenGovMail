replicaCount: 1

image:
  repository: ghcr.io/opengovmail/opengovmail-autodiscover
  tag: main
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  enabled: true
  type: ClusterIP
  port: 8080

# Domains served by this chart. Empty derives a single entry from global.domain.
# Set explicitly to serve additional domains; the first entry becomes the
# primary domain and determines the default mail.<domain> hostname.
domains: []

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # Empty serves global.domain and global.mailHostname (mail.<domain>).
  hosts: []
  tls:
    enabled: true
    # Empty derives <host-with-dashes>-tls, the names certificate.yaml mints.
    # Set to a list matching hosts when reusing externally managed Secrets.
    secretNames: []

resources: {}

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
